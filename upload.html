<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Image - GitHub Host</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 500px;
    position: relative;
  }

  /* Back Button */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    margin-bottom: 16px;
    transition: background 0.2s, transform 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.35); transform: translateX(-3px); }
  .back-btn svg { width: 18px; height: 18px; }

  .card {
    background: #fff;
    padding: 36px 30px;
    border-radius: 20px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
  }

  h1 {
    margin-bottom: 6px;
    color: #222;
    font-size: 24px;
  }
  .subtitle { color: #777; font-size: 13px; margin-bottom: 24px; }

  .input-group { margin-bottom: 18px; }
  .input-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #444;
    font-weight: 600;
  }
  .input-group input[type="text"],
  .input-group input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
    font-family: inherit;
  }
  .input-group input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
  }
  .input-group input[type="file"] {
    width: 100%;
    padding: 10px;
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    font-size: 13px;
    background: #f8fafc;
    cursor: pointer;
  }
  .input-group input[type="file"]:hover { border-color: #667eea; background: #f0f4ff; }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.45); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .status {
    margin-top: 16px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
    font-weight: 500;
  }
  .status.success { color: #16a34a; }
  .status.error { color: #dc2626; }
  .status.loading { color: #667eea; }

  .result { margin-top: 24px; padding-top: 24px; border-top: 1px solid #eee; }
  .result.hidden { display: none; }
  .result p { font-size: 13px; color: #555; margin-bottom: 8px; }

  .link-box { display: flex; gap: 8px; margin-bottom: 16px; }
  .link-box input {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    font-size: 12px;
    font-family: monospace;
    background: #f8fafc;
    color: #333;
  }
  .copy-btn {
    padding: 10px 18px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: background 0.2s;
    font-family: inherit;
  }
  .copy-btn:hover { background: #5568d3; }

  #preview {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 12px;
    display: block;
    max-height: 300px;
    object-fit: contain;
    background: #f8fafc;
  }

  .expiry {
    font-size: 12px;
    color: #d97706;
    text-align: center;
    background: #fef3c7;
    padding: 8px;
    border-radius: 8px;
    font-weight: 500;
  }

  .info-note {
    font-size: 11px;
    color: #888;
    margin-top: 10px;
    line-height: 1.5;
  }
  .info-note a { color: #667eea; text-decoration: none; font-weight: 600; }
  .info-note a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">

  <!-- Back Button → index.html -->
  <a href="index.html" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back
  </a>

  <div class="card">
    <h1>📤 Upload Image</h1>
    <p class="subtitle">Paste your GitHub token, choose image, upload. Link auto-deletes in 48h.</p>

    <div class="input-group">
      <label for="token">GitHub Personal Access Token</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx" autocomplete="off" />
      <div class="info-note">
        Needs <code>contents:write</code> scope.
        <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">Create token →</a>
      </div>
    </div>

    <div class="input-group">
      <label for="file">Select Image (max 5MB)</label>
      <input type="file" id="file" accept="image/*" />
    </div>

    <button id="uploadBtn" class="btn">Upload Image</button>

    <div id="status" class="status"></div>

    <div id="result" class="result hidden">
      <p><strong>✅ Direct Link:</strong></p>
      <div class="link-box">
        <input type="text" id="directLink" readonly />
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
      <img id="preview" alt="Uploaded image preview" />
      <p class="expiry">⏰ Auto-delete in 48 hours</p>
    </div>
  </div>
</div>

<script>
// ============================================================
// ⚙️ CONFIG — APNI DETAILS YAHAN DAALO
// ============================================================
const GITHUB_USER = "YOUR_USERNAME";     // <-- apna GitHub username
const GITHUB_REPO = "YOUR_REPO_NAME";    // <-- apna repo name
const BRANCH      = "main";              // <-- default branch
const FOLDER      = "images";            // <-- folder in repo
// ============================================================

// DOM elements
const uploadBtn = document.getElementById("uploadBtn");
const copyBtn   = document.getElementById("copyBtn");
const fileInput = document.getElementById("file");
const tokenInput = document.getElementById("token");
const statusDiv = document.getElementById("status");
const resultDiv = document.getElementById("result");
const directLink = document.getElementById("directLink");
const preview   = document.getElementById("preview");

// ---------- Helpers ----------
function setStatus(msg, type) {
  statusDiv.textContent = msg;
  statusDiv.className = "status " + (type || "");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function generateFileName(originalName) {
  const ext = (originalName.split(".").pop() || "png").toLowerCase();
  const ts = Date.now();
  const rand = Math.random().toString(36).substring(2, 8);
  return `img_${ts}_${rand}.${ext}`;
}

// ---------- Upload ----------
async function uploadImage() {
  const token = tokenInput.value.trim();
  const file  = fileInput.files[0];

  if (!token)  { setStatus("❌ GitHub token required", "error"); return; }
  if (!file)   { setStatus("❌ Please select an image", "error"); return; }
  if (!file.type.startsWith("image/")) { setStatus("❌ Only image files allowed", "error"); return; }
  if (file.size > 5 * 1024 * 1024)     { setStatus("❌ Max size 5MB", "error"); return; }

  if (GITHUB_USER === "YOUR_USERNAME" || GITHUB_REPO === "YOUR_REPO_NAME") {
    setStatus("❌ Please set GITHUB_USER & GITHUB_REPO in script.js", "error");
    return;
  }

  uploadBtn.disabled = true;
  resultDiv.classList.add("hidden");
  setStatus("⏳ Uploading...", "loading");

  try {
    const base64 = await fileToBase64(file);
    const fileName = generateFileName(file.name);
    const path = `${FOLDER}/${fileName}`;
    const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;

    const res = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Upload ${fileName} [auto-delete:48h]`,
        content: base64,
        branch: BRANCH
      })
    });

    const data = await res.json();

    if (!res.ok) {
      if (res.status === 401) throw new Error("Invalid token (401)");
      if (res.status === 404) throw new Error("Repo not found (404). Check GITHUB_USER/REPO");
      if (res.status === 422) throw new Error("File already exists or invalid (422)");
      throw new Error(data.message || "Upload failed");
    }

    // Raw direct link
    const rawLink = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/${path}`;

    directLink.value = rawLink;
    preview.src = rawLink;
    resultDiv.classList.remove("hidden");
    setStatus("✅ Upload successful!", "success");

  } catch (err) {
    console.error(err);
    setStatus("❌ " + err.message, "error");
  } finally {
    uploadBtn.disabled = false;
  }
}

// ---------- Copy Link ----------
function copyLink() {
  if (!directLink.value) return;
  directLink.select();
  directLink.setSelectionRange(0, 99999);

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(directLink.value)
      .then(() => setStatus("📋 Link copied to clipboard!", "success"))
      .catch(() => fallbackCopy());
  } else {
    fallbackCopy();
  }
}

function fallbackCopy() {
  try {
    document.execCommand("copy");
    setStatus("📋 Link copied!", "success");
  } catch {
    setStatus("❌ Copy failed — select manually", "error");
  }
}

// ---------- Events ----------
uploadBtn.addEventListener("click", uploadImage);
copyBtn.addEventListener("click", copyLink);

// Enter key par upload
tokenInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") fileInput.click();
});
