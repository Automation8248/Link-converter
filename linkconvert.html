<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <title>GitHub API Link Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }

        /* Prevent iOS auto-zoom on input focus */
        @media (max-width: 640px) {
            input, button, textarea, select {
                font-size: 16px !important;
            }
        }

        /* Smooth animations */
        .fade-in { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Prevent text overflow in read-only input */
        #outputUrl {
            text-overflow: ellipsis;
        }

        /* Safe area for notched phones */
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-3 sm:p-4 antialiased">

    <!-- Main Card -->
    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-5 sm:p-6 md:p-8">

        <!-- Back Button (top-left, inside card) -->
        <a href="index.html"
           class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-400 hover:text-blue-400 active:text-blue-300 mb-4 -ml-1 px-2 py-1 rounded-lg hover:bg-gray-700/50 transition-colors"
           aria-label="Go back to home">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            <span>Back</span>
        </a>

        <!-- Header -->
        <div class="mb-5 sm:mb-6 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-blue-900/50 text-blue-400 mb-3 sm:mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-7 sm:w-7" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">API Link Converter</h1>
            <p class="text-xs sm:text-sm text-gray-400 mt-1.5 sm:mt-2 leading-relaxed">
                Convert GitHub workflow links to API dispatch URLs
            </p>
        </div>

        <!-- Input Section -->
        <div class="space-y-3 sm:space-y-4">
            <div>
                <label for="inputUrl" class="block text-sm font-medium text-gray-300 mb-1.5">
                    GitHub Workflow URL
                </label>
                <input type="url" id="inputUrl"
                       placeholder="https://github.com/.../.github/workflows/file.yml"
                       class="w-full px-3.5 py-3 bg-gray-900 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white text-sm outline-none transition-all placeholder-gray-600"
                       autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                <p id="errorText" class="text-red-400 text-xs mt-2 hidden leading-relaxed">
                    Invalid URL. Make sure it points to a
                    <code class="bg-gray-900 px-1 py-0.5 rounded text-red-300">.github/workflows/*.yml</code>
                    file.
                </p>
            </div>

            <button id="convertBtn" type="button"
                    class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors focus:ring-4 focus:ring-blue-900 focus:outline-none flex items-center justify-center">
                <span>Convert Link</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                </svg>
            </button>
        </div>

        <!-- Output Section -->
        <div id="resultBox" class="mt-5 sm:mt-6 hidden fade-in">
            <label for="outputUrl" class="block text-sm font-medium text-gray-300 mb-1.5">
                API Dispatch URL
            </label>

            <!-- Mobile: stacked layout, Desktop: input + button side by side -->
            <div class="flex flex-col sm:flex-row gap-2 sm:gap-0 sm:relative">
                <input type="text" id="outputUrl" readonly
                       class="w-full px-3.5 py-3 bg-gray-900 border border-gray-700 rounded-lg text-green-400 text-sm outline-none font-mono sm:pr-24 truncate"
                       onclick="this.select()">
                <button id="copyBtn" type="button"
                        class="w-full sm:w-auto sm:absolute sm:right-1 sm:top-1 sm:bottom-1 bg-gray-700 hover:bg-gray-600 active:bg-gray-500 text-white text-sm font-medium px-5 py-2.5 sm:py-0 rounded-lg sm:rounded-md transition-colors flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <span id="copyLabel">Copy</span>
                </button>
            </div>

            <p class="text-[11px] text-gray-500 mt-2 leading-relaxed">
                💡 Tip: Send a POST request with <code class="text-gray-400">{"ref":"main"}</code> body and your GitHub token to trigger this workflow.
            </p>
        </div>
    </div>

    <script>
        // Cache DOM elements
        const inputUrl    = document.getElementById('inputUrl');
        const outputUrl   = document.getElementById('outputUrl');
        const resultBox   = document.getElementById('resultBox');
        const errorText   = document.getElementById('errorText');
        const convertBtn  = document.getElementById('convertBtn');
        const copyBtn     = document.getElementById('copyBtn');
        const copyLabel   = document.getElementById('copyLabel');

        // Accept both .yml and .yaml
        const WORKFLOW_REGEX = /^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/[^\/]+\/\.github\/workflows\/([^\/]+\.ya?ml)$/;

        function convertUrl() {
            const input = inputUrl.value.trim();
            const match = input.match(WORKFLOW_REGEX);

            if (match) {
                const [, owner, repo, file] = match;
                outputUrl.value = `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${file}/dispatches`;
                resultBox.classList.remove('hidden');
                errorText.classList.add('hidden');
            } else {
                errorText.classList.remove('hidden');
                resultBox.classList.add('hidden');
                // Focus input on error for quick fix
                if (input) inputUrl.focus();
            }
        }

        // Copy function with fallback
        async function copyToClipboard() {
            const text = outputUrl.value;
            if (!text) return;

            let success = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    success = true;
                } else {
                    // Fallback for non-HTTPS / old browsers
                    outputUrl.removeAttribute('readonly');
                    outputUrl.select();
                    outputUrl.setSelectionRange(0, 99999);
                    success = document.execCommand('copy');
                    outputUrl.setAttribute('readonly', '');
                }
            } catch (err) {
                console.error('Copy failed:', err);
            }

            if (success) {
                copyLabel.textContent = 'Copied!';
                copyBtn.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                copyBtn.classList.add('bg-green-600', 'hover:bg-green-500');

                setTimeout(() => {
                    copyLabel.textContent = 'Copy';
                    copyBtn.classList.remove('bg-green-600', 'hover:bg-green-500');
                    copyBtn.classList.add('bg-gray-700', 'hover:bg-gray-600');
                }, 2000);
            }
        }

        // Event listeners (no inline handlers)
        convertBtn.addEventListener('click', convertUrl);
        copyBtn.addEventListener('click', copyToClipboard);

        // Enter key triggers convert
        inputUrl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                convertUrl();
            }
        });

        // Auto-select output text on focus (mobile-friendly)
        outputUrl.addEventListener('focus', () => outputUrl.select());
    </script>
</body>
</html>
